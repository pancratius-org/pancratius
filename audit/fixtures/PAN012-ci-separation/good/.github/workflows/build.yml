name: Build
# IMPORTANT: this workflow installs Node, Python, and uv only. It MUST NOT
# install pandoc or typst, and MUST NOT run `pancratius downloads render` — that
# is local-only. This comment names banned tooling on purpose: the rule must not
# match comments.
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@0123456789abcdef0123456789abcdef01234567
        with:
          version: "2026.7.5"
          install_args: "node python uv"
      - run: npm ci
      - run: uv sync --frozen
      - name: Verify
        run: mise --locked run verify
