# Research package. It imports `pancratius`; the production library never imports it.
[project]
name = "intent-ai"
version = "0.1.0"
description = "Per-source-line lineation (prose vs lineated) for bilingual DOCX — research package."
requires-python = ">=3.13"
dependencies = [
  "pancratius",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "pillow>=10.4",
]

# The live teacher panel calls OpenRouter through its official SDK. It is an OPTIONAL extra so the
# default/test environment (and the import-time get_type_hints sweep) stays SDK-free — the adapter
# imports it lazily, only a live run needs it. Install with `uv sync --extra live`, or a one-off
# `uv run --extra live python -m intent_ai.teacher.recipes panel <recipe.toml>`.
[project.optional-dependencies]
live = ["openrouter>=0.9,<1"]   # pin to the 0.9.x API the adapter is written against

[dependency-groups]
dev = ["pytest>=9.0", "ty>=0.0.1a17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_ai"]
# The vendored physics metric oracle (Liberation Serif + its OFL) is data, not code — name it
# explicitly so a built wheel/sdist carries it; without this the build drops it and `physics` import
# fails on an installed package.
artifacts = ["src/intent_ai/vendor/*"]

[tool.hatch.build.targets.sdist]
include = ["src/intent_ai", "tests", "SPEC.md", "ARCHITECTURE.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["experiments/history"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "RUF100"]

[tool.ty.environment]
python-version = "3.13"
root = ["src"]

[tool.ty.src]
include = ["src/intent_ai"]

[tool.uv.sources]
pancratius = { path = "..", editable = true }
