name: Sync videos

# Scaffolds newly published videos. `pancratius video sync` reads the configured
# YouTube channels and makes one OpenRouter call per new video to split the raw
# description into a hook + reading body. The content gate runs before the PR
# opens; the PR itself is created with a video-sync GitHub App token so its
# pull_request gate runs unattended and auto-merge can complete — a
# GITHUB_TOKEN-created PR only produces a run held for manual approval.
#
# This is the one `pancratius` command that runs in CI — the documented exception
# to the Local-vs-CI rule (docs/architecture.md) — because it is external-API
# ingestion, not a local DOCX/PDF/EPUB toolchain: it imports no documents and
# renders no artifacts. Without OPENROUTER_API_KEY the split falls back to a
# deterministic clean-and-strip.

on:
  schedule:
    - cron: "0 9 * * *"   # daily, 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: video-sync
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Setup locked toolchain
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: "2026.7.5"
          install_args: "node python uv"
          cache: true

      - name: Install Python deps (frozen lock)
        run: uv sync --frozen

      - name: Scan YouTube channels and draft new video descriptions
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --frozen pancratius video sync

      - name: Stop early if nothing changed
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new videos; skipping the content gate + PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Install npm dependencies
        # Only the content gate needs npm; the scan is Python-only.
        if: steps.diff.outputs.changed == 'true'
        run: npm ci

      - name: Verify the new content
        # Type/schema checks, the architectural audit (PAN028 guards the hooks),
        # and a clean build — enough to prove the scaffolded videos are valid and
        # render. The content gate omits intent-ai, npm dependency audit, audit
        # self-tests, and Playwright because a generated video cannot affect those
        # surfaces. If any check fails the PR is never opened.
        if: steps.diff.outputs.changed == 'true'
        run: mise --locked run verify:content

      - name: Mint video-sync App token
        if: steps.diff.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.VIDEO_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.VIDEO_SYNC_APP_PRIVATE_KEY }}

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot/video-sync
          delete-branch: true
          commit-message: "feat(content): sync new videos"
          title: "feat(content): sync new videos"
          body: |
            Automated by `.github/workflows/video-sync.yml`.

            Content checks, the audit, and a clean build passed inside the
            workflow before this PR was opened. The required PR gate runs as
            a normal pull_request check before GitHub auto-merges it.

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
