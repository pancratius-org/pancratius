name: PR verify

# Pull-request quality gate: `mise --locked run verify` — the single gate from
# docs/tooling.md (checks, audits, build, Playwright e2e). CI runs the exact
# command maintainers run locally, so "passes locally" == "passes in CI".
#
# Installs the locked Node, Python, and uv toolchain plus the Playwright chromium
# browser (verify runs e2e). It MUST NOT install pandoc or typst — the build
# copies committed PDFs/EPUBs from `src/content/`, so CI never renders documents
# (see docs/downloads.md).

on:
  pull_request:
  workflow_dispatch:

# Least privilege: this job only checks out and runs the gate — read is enough.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Setup locked toolchain
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: "2026.7.5"
          install_args: "node python uv"
          cache: true

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python deps (frozen lock)
        run: uv sync --frozen

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Verify (the gate — checks, audits, build, e2e)
        run: mise --locked run verify

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
