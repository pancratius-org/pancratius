name: PR verify

# Pull-request quality gate: `mise --locked run verify` — the single gate from
# docs/tooling.md (checks, audits, build, Playwright e2e). CI runs the exact
# command maintainers run locally, so "passes locally" == "passes in CI".
#
# Installs the locked Node, Python, and uv toolchain plus the Playwright chromium
# browser (verify runs e2e). It MUST NOT install pandoc or typst — the build
# copies committed PDFs/EPUBs from `src/content/`, so CI never renders documents
# (see docs/downloads.md).

on:
  pull_request:
  workflow_dispatch:

# Least privilege: this job only checks out and runs the gate — read is enough.
permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      - name: Setup locked toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: "2026.8.6"
          install_args: "node python uv"
          cache: true

      - name: Install npm dependencies
        run: npm ci

      - name: Restore Astro asset cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-v1-${{ hashFiles('package-lock.json', 'astro.config.ts', 'src/content/**/*.jpg', 'src/content/**/*.png', 'src/content/**/*.svg') }}
          restore-keys: |
            ${{ runner.os }}-astro-v1-

      - name: Install Python deps (frozen lock)
        run: uv sync --frozen

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Verify (the gate — checks, audits, build, e2e)
        run: mise --locked run verify

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
