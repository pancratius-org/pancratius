version: 2

# Dependabot keeps the SHA-pinned third-party actions (and `actions/*` major
# tags) current. Without it, SHA pins go stale and accumulate known CVEs.
# Each PR bumps both the SHA and the `# version` comment together.
#
# Security fixes are grouped by dependency graph. A high-severity advisory makes
# the repository gate fail, so isolated fixes can deadlock behind vulnerabilities
# that only a sibling PR repairs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    exclude-paths:
      - "audit/fixtures/**" # synthetic audit manifests, never installed
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    ignore:
      # @types/node major must track the Node runtime (mise.toml / engines.node);
      # bump it together with those, never as a standalone major-version PR.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      astro:
        applies-to: version-updates
        patterns:
          - "astro"
          - "@astrojs/*"
          - "satteri"
      conceptosphere-viz:
        applies-to: version-updates
        patterns:
          - "sigma"
          - "graphology"
          - "graphology-*"
      dev:
        applies-to: version-updates
        dependency-type: development
      production:
        applies-to: version-updates
        dependency-type: production

  - package-ecosystem: uv
    directories:
      - /
      - /intent-ai
    schedule:
      interval: weekly
      day: sunday
    groups:
      python:
        patterns: ["*"]
